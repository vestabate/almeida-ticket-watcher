name: Test booking page
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python inspect_booking.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-page-diagnostic
          path: diagnostic/
          retention-days: 3
